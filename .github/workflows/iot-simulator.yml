name: 🍄 24/7 IoT Sensor Simulator

on:
  schedule:
    # Trigger setiap 4 jam sekali (UTC: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00)
    # Menjamin siklus simetris membagi 24 jam sehari (24 / 4 = 6 run/hari)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Tombol manual trigger di GitHub Actions UI
  push:
    paths:
      - 'iot_simulator.py'
      - '.github/workflows/iot-simulator.yml'

# Cegah race condition: saat runner baru masuk, runner lama otomatis di-cancel
# Buffer 30 menit (durasi 4.5 jam vs jadwal 4 jam) menjamin TIDAK PERNAH ADA JEDA KOSONG!
concurrency:
  group: iot-sensor-simulator
  cancel-in-progress: true

jobs:
  simulate:
    name: Running Telemetry Simulator
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Jalankan Simulasi Sensor (Buffer 4.5 Jam)
        # 16.200 detik = 4.5 jam. Cron jalan tiap 4 jam sehingga ada overlap aman 30 menit.
        # Bahkan jika antrian GitHub Actions delay hingga 30 menit, data tetap ngalir nonstop!
        env:
          TZ: 'Asia/Jakarta'
        run: |
          python -u iot_simulator.py --duration 16200
