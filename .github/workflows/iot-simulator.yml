name: 🍄 24/7 IoT Sensor Simulator

on:
  schedule:
    # Trigger setiap 1 jam di menit 17 (UTC: tiap jam)
    # Runner hidup selama 5.5 jam (19.800s), jadi meskipun GitHub Actions menunda beberapa cron,
    # runner sebelumnya masih tetap hidup dan streaming data nonstop tanpa pernah ada jeda kosong.
    - cron: '17 * * * *'
  workflow_dispatch: # Tombol manual trigger di GitHub Actions UI
  push:
    paths:
      - 'iot_simulator.py'
      - '.github/workflows/iot-simulator.yml'

# Cegah race condition: saat runner baru masuk, runner lama otomatis di-cancel secara graceful
concurrency:
  group: iot-sensor-simulator
  cancel-in-progress: true

jobs:
  simulate:
    name: Running Telemetry Simulator
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Jalankan Simulasi Sensor (Durasi Maksimal 5.5 Jam)
        # 19.800 detik = 5.5 jam (mendekati batas maksimal GitHub runner 6 jam).
        # Dengan cron tiap 1 jam + buffer raksasa 4.5 jam, data dijamin 100% ngalir 24/7 nonstop!
        env:
          TZ: 'Asia/Jakarta'
        run: |
          python -u iot_simulator.py --duration 19800


