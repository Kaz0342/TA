name: 🍄 24/7 IoT Sensor Simulator

on:
  schedule:
    # Trigger setiap 5 jam (UTC)
    # Runner hidup selama 5 jam (18.000s), cancel-in-progress dinonaktifkan agar telemetry tidak terpotong tiba-tiba.
    - cron: '0 */5 * * *'
  workflow_dispatch: # Tombol manual trigger di GitHub Actions UI
  push:
    paths:
      - 'iot_simulator.py'
      - '.github/workflows/iot-simulator.yml'

# Concurrency group dengan cancel-in-progress: false agar simulasi berjalan kontinu
concurrency:
  group: iot-sensor-simulator
  cancel-in-progress: false

jobs:
  simulate:
    name: Running Telemetry Simulator
    runs-on: ubuntu-latest
    timeout-minutes: 320

    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Jalankan Simulasi Sensor (Durasi Maksimal 5 Jam)
        # 18.000 detik = 5 jam. Berjalan kontinu sesuai interval cron tanpa overlap abort.
        env:
          TZ: 'Asia/Jakarta'
          API_BASE_URL: 'https://tugasakhir-lime.vercel.app/api'
        run: |
          python -u iot_simulator.py --duration 18000


