name: 🍄 24/7 IoT Sensor Simulator

on:
  schedule:
    # Trigger setiap 2 jam di menit 17 (UTC: 01:17, 03:17, 05:17, dst)
    # Menghindari menit :00 yang sering mengalami antrean overload dan di-drop oleh GitHub Actions scheduler
    - cron: '17 */2 * * *'
  workflow_dispatch: # Tombol manual trigger di GitHub Actions UI
  push:
    paths:
      - 'iot_simulator.py'
      - '.github/workflows/iot-simulator.yml'

# Cegah race condition: saat runner baru masuk, runner lama otomatis di-cancel
# Overlap 30 menit (durasi 2.5 jam vs jadwal 2 jam) menjamin data tidak pernah terputus
concurrency:
  group: iot-sensor-simulator
  cancel-in-progress: true

jobs:
  simulate:
    name: Running Telemetry Simulator
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Jalankan Simulasi Sensor (Buffer 2.5 Jam)
        # 9.000 detik = 2.5 jam. Cron jalan tiap 2 jam sehingga ada overlap aman 30 menit.
        # Concurrency cancel-in-progress akan menghentikan runner lama secara graceful saat runner baru aktif.
        env:
          TZ: 'Asia/Jakarta'
        run: |
          python -u iot_simulator.py --duration 9000

